<!DOCTYPE html>
<html lang="en">
<head>

    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="profile-card">

        <div class="info-box">
            <img src="gambar/WhatsApp Image 2026-10-08 at 10.33.54.jpg.jpeg" alt="">

            <div class="info">

            </div>
        </div>
